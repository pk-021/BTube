<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/popup.css" />
  
  <!-- Scripts (non-module scripts can go here) -->
  <script src="js/popup.js" defer></script>
</head>
<body>
  <div id="popup">
    <!-- tab content area -->
    <main class="content-area">
      <!-- Home tab view (default) -->
      <section id="tab-home" class="tab-view active" aria-label="Home" role="region">
        <div class="line">
          <div class="logo">
            <img src="assets/logo_v2.png" alt="logo" />BTube
          </div>
        </div>

        <div class="home-list" aria-label="Quick controls">
          <div class="home-row home-row-theme">
            <div class="home-copy">
              <div class="home-title">Theme</div>
              <div class="home-subtitle">Choose your preferred theme</div>
            </div>
            <select id="themeSelector" class="theme-selector" aria-label="Theme selection">
              <option value="system">System</option>
              <option value="light">Day</option>
              <option value="dark">Night</option>
            </select>
          </div>

          <button type="button" id="home-mode-row" class="home-row home-row-button">
            <div class="home-copy">
              <div class="home-title">Mode</div>
              <div class="home-subtitle">Current preset</div>
            </div>
            <div class="home-row-right">
              <span id="home-mode-value" class="home-value">Custom</span>
              <svg class="home-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </button>

          <button type="button" id="home-blocked-row" class="home-row home-row-button">
            <div class="home-copy">
              <div class="home-title">Blocked Websites</div>
              <div class="home-subtitle">Manage blocked items</div>
            </div>
            <div class="home-row-right">
              <span id="home-blocked-count" class="home-value">0</span>
              <svg class="home-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </button>
        </div>
      </section>

      <!-- Settings tab view -->
      <section id="tab-settings" class="tab-view" aria-label="Modes" role="region" hidden>
        <div class="settings-subview-stack">
          <!-- Settings Mode Selector View -->
          <div class="settings-mode-view">
            <div class="tab-page-header">
              <div class="tab-page-header-left">
                <button type="button" id="back-from-settings-btn" class="back-btn" aria-label="Back to Home">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <h2 id="settings-view-title">Mode</h2>
              </div>
            </div>

            <!-- Mode Selector Grid -->
            <div class="mode-selector">
              <label class="mode-option">
                <input type="radio" name="settings-mode" value="off" />
                <div class="mode-card">
                  <div class="mode-title">OFF</div>
                  <div class="mode-desc">Extension disabled</div>
                </div>
              </label>

              <label class="mode-option">
                <input type="radio" name="settings-mode" value="minimal" />
                <div class="mode-card">
                  <div class="mode-title">Minimal</div>
                  <div class="mode-desc">Minimal homepage + Disable shorts</div>
                </div>
              </label>

              <label class="mode-option">
                <input type="radio" name="settings-mode" value="high-focus" />
                <div class="mode-card">
                  <div class="mode-title">High Focus</div>
                  <div class="mode-desc">All features enabled</div>
                </div>
              </label>

              <label class="mode-option mode-custom">
                <input type="radio" name="settings-mode" value="custom" id="custom-mode-radio" />
                <div class="mode-card">
                  <div class="mode-title">Custom</div>
                  <div class="mode-desc">Choose your preferences</div>
                </div>
                <button type="button" id="edit-custom-btn" class="edit-custom-btn" hidden>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                  Edit
                </button>
              </label>
            </div>
          </div>

          <!-- Custom Settings Editor View -->
          <div class="settings-custom-view" hidden>
            <div class="tab-page-header custom-settings-header">
              <div class="tab-page-header-left">
                <button type="button" id="back-to-modes-btn" class="back-btn" aria-label="Back to modes">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <h2>Custom Settings</h2>
              </div>
            </div>

            <div class="custom-settings-list">
              <div class="setting-item">
                <label for="redirect-subscriptions">Redirect to Subscriptions</label>
                <label class="switch">
                  <input type="checkbox" id="redirect-subscriptions" />
                  <span class="slider"></span>
                </label>
              </div>

              <div class="setting-item">
                <label for="disable-shorts">Disable Shorts</label>
                <label class="switch">
                  <input type="checkbox" id="disable-shorts" />
                  <span class="slider"></span>
                </label>
              </div>

              <div class="setting-item">
                <label for="minimal-homepage">Minimal Homepage</label>
                <label class="switch">
                  <input type="checkbox" id="minimal-homepage" />
                  <span class="slider"></span>
                </label>
              </div>

              <div class="setting-item">
                <label for="enable-website-blocking">Enable Website Blocking</label>
                <label class="switch">
                  <input type="checkbox" id="enable-website-blocking" />
                  <span class="slider"></span>
                </label>
              </div>

              <div class="setting-item">
                <label for="hide-sidebar-recommendations">Hide Sidebar Recommendations</label>
                <label class="switch">
                  <input type="checkbox" id="hide-sidebar-recommendations" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Blocking tab view -->
      <section id="tab-blocking" class="tab-view" aria-label="Blocked Websites" role="region" hidden>
        <div class="tab-page-header">
          <div class="tab-page-header-left">
            <button type="button" id="back-from-blocking-btn" class="back-btn" aria-label="Back to Home">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <h2 id="blocking-view-title">Blocked Websites</h2>
          </div>
          <div class="controls">
            <button type="button" id="add-block-btn" class="add-block-btn toolbar-btn is-hidden" title="Add blocked website or channel">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
                <path d="M12 8v8M8 12h8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="blocking-container">
          <!-- Blocked Websites Section -->
          <div class="blocked-section">
            <div id="blocked-websites-list" class="blocked-list">
              <!-- Blocked websites will be dynamically inserted here -->
            </div>
            <p class="empty-message" id="empty-websites" hidden>No blocked websites yet</p>
          </div>

        </div>
      </section>
    </main>

    <footer class="popup-footer" aria-label="Pending changes actions">
      <div class="popup-footer-status" aria-live="polite">
        <span id="pending-changes-label" class="popup-footer-label">Pending Changes</span>
      </div>
      <div class="popup-footer-actions">
        <button type="button" id="cancel-changes-btn" class="cancel-settings-btn">Cancel</button>
        <button type="button" id="save-settings-btn" class="save-settings-btn is-hidden" disabled>Save</button>
      </div>
    </footer>


    <!-- Test notification button (hidden by default, uncomment for testing) -->
    <!-- <button id="test-notification" style="margin: 10px; padding: 8px 16px; background: #ff0000; color: white; border: none; border-radius: 4px; cursor: pointer;">Test Notification</button> -->
  </div>

  <!-- Add Block Overlay -->
  <div id="add-block-overlay" class="overlay" hidden>
    <div class="overlay-content">
      <div class="overlay-header">
        <h2>Add Blocked Content</h2>
        <button id="close-overlay-btn" class="close-btn" title="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="overlay-body">
        <div class="input-section">
          <div id="website-input" class="input-group">
            <label for="website-url">Website URL</label>
            <input 
              type="text" 
              id="website-url" 
              placeholder="e.g., youtube.com/watch?v=..." 
              autocomplete="off"
            />
            <small>Enter the full URL or domain you want to block</small>
          </div>
        </div>

        <div class="overlay-actions">
          <button id="cancel-overlay-btn" class="btn-secondary">Cancel</button>
          <button id="save-overlay-btn" class="btn-primary">Add Block</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Login Overlay -->
  <div id="login-overlay" class="overlay login-overlay" hidden>
    <div class="overlay-content login-overlay-content">
      <iframe
        id="login-frame"
        class="login-frame"
        title="Unlock Extension"
        src="about:blank"
      ></iframe>
    </div>
  </div>
</body>
</html>
